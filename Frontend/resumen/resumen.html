<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resumen del pedido</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h2>Cafeteria pro</h2>
  </header>

  <main>
    <section class="tarjeta">
      <h1>Resumen del pedido</h1>
      <p class="exito">Tu pedido se registró correctamente.</p>

      <div class="datos">
        <div class="dato">
          <span class="etiqueta">Nombre</span>
          <p id="nombre"></p>
        </div>

        <div class="dato">
          <span class="etiqueta">Correo electrónico</span>
          <p id="correo"></p>
        </div>

        <div class="dato">
          <span class="etiqueta">Producto</span>
          <p id="producto"></p>
        </div>

        <div class="dato">
          <span class="etiqueta">Cantidad</span>
          <p id="cantidad"></p>
        </div>

        <div class="dato">
          <span class="etiqueta">Tamaño de bebida</span>
          <p id="tamano"></p>
        </div>

        <div class="dato">
          <span class="etiqueta">Para llevar</span>
          <p id="llevar"></p>
        </div>

        <div class="dato completo">
          <span class="etiqueta">Observaciones</span>
          <p id="observaciones"></p>
        </div>
      </div>
    </section>
  </main>

  
  <script src="script.js"></script>
</body>
</html>
