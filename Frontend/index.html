<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cafeteria pro</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

  <header>
    <h2>Cafeteria pro</h2>
  </header>

  <main>
    <form id="formulario" action="http://localhost:3000/pedido" method="post">
      <h1>Registro de pedido</h1>
      <p class="gris">Llena tus datos para registrar tu pedido.</p>

      <div class="fila">
        <div class="campo">
          <label for="nombre">Nombre *</label>
          <input type="text" id="nombre" name="cliente">
          <small id="errorNombre"></small>
        </div>


        <div class="campo">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" name="correo">
          <small id="errorCorreo"></small>
        </div>
      </div>

      <div class="fila">
        <div class="campo">
          <label for="producto">Producto</label>
          <select id="producto" name="producto">
            <option value="">Selecciona un producto</option>
            <option>Café americano</option>
            <option>Capuchino</option>
            <option>Latte</option>
            <option>Moka</option>
          </select>
          <small id="errorProducto"></small>
        </div>
        <div class="campo">
          <label>Cantidad</label>
          <div class="cantidad">
            <button type="button" id="menos">-</button>
            <input type="text" id="cantidad" name="cantidad" value="1" readonly>
            <button type="button" id="mas">+</button>
          </div>
        </div>
      </div>



      <div class="fila">
        <div class="campo">
          <label>Tamaño de bebida</label>
          <label><input type="radio" name="tamano" value="Chico"> Chico</label>
          <label><input type="radio" name="tamano" value="Mediano"> Mediano</label>
          <label><input type="radio" name="tamano" value="Grande"> Grande</label>
        </div>
        <div class="campo">
          <label>Para llevar</label>
          <label><input id="checkboxl" type="checkbox" name="llevar" value="Sí"> Pedido para llevar</label>
        </div>
      </div>

      <div class="campo">
        <label for="observaciones">Observaciones</label>
        <textarea id="observaciones" name="observaciones" rows="4"></textarea>
      </div>

      <p id="mensaje"></p>

      <div class="botones">
        <button type="reset" id="vaciar">Vaciar formulario</button>
        <button type="submit" id="registrar">Registrar pedido</button>
      </div>
    </form>
  </main>



  <script src="script.js"></script>
</body>
</html>
